name: Sync Dify API Image to Aliyun

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Dify API 版本'
        required: false
        default: '1.14.2'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取 Dify API 镜像
        run: |
          docker pull langgenius/dify-api:${{ github.event.inputs.version || '1.14.2' }}

      - name: 打标签
        run: |
          docker tag langgenius/dify-api:${{ github.event.inputs.version || '1.14.2' }} \
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/dify-api:${{ github.event.inputs.version || '1.14.2' }}

      - name: 登录阿里云镜像仓库
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login -u "${{ secrets.ALIYUN_USERNAME }}" --password-stdin ${{ secrets.ALIYUN_REGISTRY }}

      - name: 推送镜像到阿里云
        run: |
          docker push ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/dify-api:${{ github.event.inputs.version || '1.14.2' }}
